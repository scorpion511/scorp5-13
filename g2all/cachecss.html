<!DOCTYPE html>
<html manifest="css.manifest">
<head>
    <title>PS4 [5.05] 7.00 - 13.52 FW GoldHEN Host by SCORPION</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<!-- Repositioned heading ID so the caching scripts can find it instantly -->
<h1 id="msgs" style="font-size: 30px; margin-top: 77px; margin-bottom: 120px; text-align: center;">Starting Cache Installation...</h1>

<script>
    history.replaceState(null, null, 'index.html');
    var histlength = history.length;
    history.go(-histlength);

    function DLProgress(e) {
        var Percent = (Math.round(e.loaded / e.total * 100));
        document.getElementById("msgs").innerHTML = "Installing Offline Cache: " + Percent + "%";
    }

    function DisplayCacheProgress() {
        document.getElementById("msgs").innerHTML = "Cache Installed Successfully ✔";
        setTimeout(function() {
            document.getElementById("msgs").innerHTML = "Now Close And Re-Open Your Browser ...";
        }, 1500);
    }

    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onerror = function(e) { 
        document.getElementById("msgs").innerHTML = "Error Installing Cache! - Clear and Re-Open Your Browser ..."; 
    };
</script>

<div style="text-align: center;">
    <h1>PS4 [5.05] 7.00 - 13.52 FW GoldHEN Host by SCORPION</h1>
    <hr>
</div>

<!-- Clean, Centered Fixed Screen Layout Credit Line -->
<div style="position: fixed; bottom: 25px; left: 0; width: 100%; text-align: center; z-index: 9999;">
    <h2 style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 26px; color: #ffffff; text-shadow: 0px 0px 12px #f31414, 0px 0px 6px #000000; letter-spacing: 1px; font-weight: bold; margin: 0;">
        Designed and Compiled By <span style="color: #f31414;">Ahmed Essam</span>
    </h2>
</div>

</body>
</html>
